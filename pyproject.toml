[project]
name = "kitforge"
version = "0.1.0"
description = "Turn any song into a playable multi-octave sampler kit"
requires-python = "==3.11.*"
dependencies = [
    # Core audio
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",

    # Separation
    "demucs>=4.0.0",
    "torchcodec>=0.12.0",
    "audio-separator[cpu]>=0.28.0",

    # Transcription
    "basic-pitch>=0.3.0",
    "torchcrepe>=0.0.21",
    "pretty_midi>=0.2.10",
    "mido>=1.3.0",

    # Timbre / embeddings
    "laion-clap>=1.1.4",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",

    # Sample processing
    "pyrubberband>=0.3.0",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4.0",
    "deepfilternet>=0.5.6",

    # Banquet query separation (optional enhanced quality for guitar/piano/synth)
    "pytorch-lightning>=2.0.0",
    "hear21passt>=0.0.26",
    "torchmetrics>=1.0.0",

    # Packaging / CLI
    "typer>=0.12.0",
    "pydantic-settings>=2.2.0",
    "diskcache>=5.6.3",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "matplotlib>=3.8.0",
    "rich>=13.7.0",
    "tomli>=2.0.0",
]

[project.scripts]
kitforge = "kitforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# LarsNet installed separately from GitHub (not on PyPI yet)


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
